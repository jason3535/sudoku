<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#ffffff">
<title>数独训练营</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
/* 墨水屏优先：纯黑白、无动画、无阴影渐变、大点击区 */
:root { --ink: #000; --paper: #fff; --mid: #777; --soft: #e4e4e4; --line: #000; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--paper); color: var(--ink); }
body { font: 22px/1.5 -apple-system, "PingFang SC", "Noto Sans CJK SC", "Source Han Sans SC", "Microsoft YaHei", sans-serif;
  -webkit-user-select: none; user-select: none; overscroll-behavior: none; }
*, *::before, *::after { transition: none !important; animation: none !important; }
#app { max-width: 920px; margin: 0 auto; padding: 16px 16px 40px; }
h1 { font-size: 34px; margin: 6px 0 2px; letter-spacing: 2px; }
h2 { font-size: 26px; margin: 22px 0 10px; }
p { margin: 8px 0; }
.sub { color: var(--mid); font-size: 19px; }
.small { font-size: 18px; }
button { font: inherit; color: var(--ink); background: var(--paper); border: 2px solid var(--ink); border-radius: 10px;
  padding: 10px 18px; min-height: 56px; cursor: pointer; }
button:active, button.on { background: var(--ink); color: var(--paper); }
button[disabled] { border-color: #bbb; color: #aaa; }
button.big { width: 100%; font-size: 26px; min-height: 76px; margin: 8px 0; }
button.link { border: 0; padding: 6px 4px; min-height: 48px; text-decoration: underline; }
.row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.row > .grow { flex: 1; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.card { border: 2px solid var(--ink); border-radius: 14px; padding: 14px 18px; margin: 14px 0; }
.card.thin { border-width: 1px; }
.tile { border: 2px solid var(--ink); border-radius: 14px; padding: 18px; min-height: 130px; text-align: left; width: 100%; }
.tile b { display: block; font-size: 28px; }
.tile span { font-size: 18px; color: var(--mid); }
.tile:active span { color: var(--paper); }
.top { display: flex; align-items: center; gap: 10px; min-height: 60px; border-bottom: 2px solid var(--ink); margin-bottom: 12px; padding-bottom: 6px; }
.top .t { flex: 1; font-size: 24px; font-weight: 700; }
.top .clock { font-size: 22px; min-width: 90px; text-align: right; }
.check { display: flex; gap: 12px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--soft); }
.check:last-child { border-bottom: 0; }
.check .box { width: 34px; height: 34px; border: 2px solid var(--ink); border-radius: 6px; display: flex; align-items: center; justify-content: center; font-weight: 700; flex: none; }
.check .box.done { background: var(--ink); color: var(--paper); }
.check .what { flex: 1; }
.check button { min-height: 50px; padding: 6px 16px; }
table { border-collapse: collapse; width: 100%; font-size: 19px; }
th, td { border-bottom: 1px solid var(--soft); padding: 8px 6px; text-align: left; }
th { border-bottom: 2px solid var(--ink); }
.stars { letter-spacing: 2px; }
.lvlist { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; }
.lvbtn { min-height: 86px; padding: 4px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.lvbtn small { font-size: 15px; letter-spacing: 1px; }
.msg { min-height: 96px; font-size: 21px; padding: 10px 4px; }
.msg b { font-weight: 700; }

/* 棋盘 */
.board { display: grid; margin: 0 auto; border: 4px solid var(--line); background: var(--paper); }
.cell { position: relative; display: flex; align-items: center; justify-content: center; border-right: 1px solid #888; border-bottom: 1px solid #888;
  font-weight: 400; color: #333; font-variant-numeric: tabular-nums; }
.cell.rb { border-right: 3px solid var(--line); }
.cell.bb { border-bottom: 3px solid var(--line); }
.cell.lastc { border-right: 0; }
.cell.lastr { border-bottom: 0; }
.cell.g { font-weight: 800; color: #000; }
.cell.hl { background: var(--soft); }
.cell.same { background: #c8c8c8; }
.cell.sel { box-shadow: inset 0 0 0 5px #000; }
.cell.ans { box-shadow: inset 0 0 0 5px #000; font-weight: 800; color: #000; }
.cell.blk { box-shadow: inset 0 0 0 3px #000; }
.cell.ring .v { border: 3px solid #000; border-radius: 50%; width: 1.35em; height: 1.35em; display: flex; align-items: center; justify-content: center; }
.cell.x::after { content: "×"; position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 1.5em; color: #666; font-weight: 300; }
.cell.wrong { background: repeating-linear-gradient(135deg, #fff 0 7px, #999 7px 9px); }
.cell.wrong .v { background: #fff; padding: 0 4px; }
.cell.conf .v { text-decoration: underline; text-decoration-thickness: 3px; }
.notes { position: absolute; inset: 3px; display: grid; font-size: 0.32em; color: #222; font-weight: 600; }
.notes span { display: flex; align-items: center; justify-content: center; }

.pad { display: grid; gap: 10px; margin-top: 12px; }
.pad button { min-height: 78px; font-size: 34px; padding: 0; position: relative; }
.pad button small { position: absolute; right: 6px; bottom: 2px; font-size: 14px; }
.tools { display: grid; gap: 10px; margin-top: 10px; }
.tools button { min-height: 64px; padding: 0 4px; font-size: 21px; }

.overlay { position: fixed; inset: 0; background: rgba(255,255,255,0.96); display: flex; align-items: center; justify-content: center; z-index: 9; }
.overlay .card { background: #fff; width: min(620px, 92vw); border-width: 3px; text-align: center; }
.result-stars { font-size: 64px; letter-spacing: 8px; margin: 6px 0; }
.mini { display: inline-grid; border: 2px solid #000; vertical-align: top; }
.mini div { border-right: 1px solid #aaa; border-bottom: 1px solid #aaa; display: flex; align-items: center; justify-content: center; font-size: 14px; }
.mini div.g { font-weight: 800; }
.mini div.rb { border-right: 2px solid #000; }
.mini div.bb { border-bottom: 2px solid #000; }
.mini div.wrong { background: #bbb; }
.mini div.lc { border-right: 0; }
.mini div.lr { border-bottom: 0; }
.days { display: grid; grid-template-columns: repeat(14, 1fr); gap: 6px; align-items: end; height: 190px; }
.days div { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; }
.days span { width: 70%; background: #000; min-height: 2px; }
.days small { font-size: 14px; }
.days b { font-size: 15px; font-weight: 400; text-align: center; line-height: 1.2; margin-top: 4px; }
.bar { height: 22px; background: #000; display: inline-block; vertical-align: middle; }
textarea { width: 100%; height: 140px; font: 15px/1.3 monospace; border: 2px solid #000; border-radius: 8px; padding: 8px; }
.tag { display: inline-block; border: 1px solid #000; border-radius: 6px; padding: 0 8px; font-size: 16px; margin-left: 6px; }
@media (max-width: 600px) { body { font-size: 18px; } .lvlist { grid-template-columns: repeat(5, 1fr); } .tile b { font-size: 22px; } }
</style>
</head>
<body>
<div id="app"></div>
<noscript>需要打开 JavaScript。</noscript>
<script src="core.js"></script>
<script src="puzzles.js"></script>
<script src="app.js"></script>
</body>
</html>
